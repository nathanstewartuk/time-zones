<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>time-zones.net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Display:wght@400;500;700&family=Google+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #eef0f4;
  --canvas-2: #e2e6ee;
  --surface: rgba(255,255,255,0.55);
  --surface-strong: rgba(255,255,255,0.72);
  --border: rgba(255,255,255,0.75);
  --border-2: rgba(15,20,30,0.08);
  --text: #10131a;
  --text-dim: rgba(16,19,26,0.60);
  --text-faint: rgba(16,19,26,0.40);
  --dot: rgba(20,26,40,0.10);
  --dial-track: rgba(20,26,40,0.06);
  --num-day: rgba(60,45,10,0.78);
  --num-night: rgba(255,255,255,0.92);
  --accent: #7c5cff;
  --shadow: 0 30px 60px -24px rgba(20,26,45,0.35);
  --glass-blur: blur(22px) saturate(1.4);
}
html[data-theme="dark"] {
  --canvas: #05060a;
  --canvas-2: #0b0e16;
  --surface: rgba(26,28,36,0.48);
  --surface-strong: rgba(30,33,42,0.6);
  --border: rgba(255,255,255,0.14);
  --border-2: rgba(255,255,255,0.06);
  --text: #f3f5fa;
  --text-dim: rgba(243,245,250,0.66);
  --text-faint: rgba(243,245,250,0.40);
  --dot: rgba(255,255,255,0.10);
  --dial-track: rgba(255,255,255,0.05);
  --num-day: rgba(40,28,4,0.86);
  --num-night: rgba(255,255,255,0.92);
  --accent: #c792ea;
  --shadow: 0 40px 80px -30px rgba(0,0,0,0.8);
  --glass-blur: blur(26px) saturate(1.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* background lives on html so it fills iOS safe-areas (no black bars / grey strip) */
html {
  height: 100%;
  overflow: hidden;
  background: var(--canvas) radial-gradient(120% 90% at 50% 0%, var(--canvas-2), var(--canvas) 60%) fixed;
  transition: background .5s ease;
}
body {
  height: 100dvh;
  overflow: hidden;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  color: var(--text);
  font-family: "Google Sans", system-ui, sans-serif;
  transition: color .5s ease;
}
/* dot grid: canvas physics sim (stitch port). cursor pushes dots, they chase back. */
.dot-canvas-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.dot-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
header {
  position: relative; z-index: 4; flex: 0 0 auto;
  display: flex; justify-content: flex-end;
  padding: 10px clamp(16px,5vw,48px) 0;
}
.theme-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--surface-strong); border: 1px solid var(--border);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 8px 22px -10px rgba(20,26,45,.4);
  cursor: pointer; position: relative; overflow: hidden; color: var(--text);
  display: grid; place-items: center;
}
.theme-btn svg { position: absolute; width: 22px; height: 22px;
  transition: transform .55s cubic-bezier(.34,1.56,.64,1), opacity .4s ease; }
.theme-btn .i-moon { transform: rotate(0) scale(1); opacity: 1; }
.theme-btn .i-sun  { transform: rotate(-120deg) scale(.3); opacity: 0; }
html[data-theme="dark"] .theme-btn .i-moon { transform: rotate(120deg) scale(.3); opacity: 0; }
html[data-theme="dark"] .theme-btn .i-sun  { transform: rotate(0) scale(1); opacity: 1; }

main {
  position: relative; z-index: 4; flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column;
  padding: 10px clamp(14px,4vw,48px) 14px;
}

.pickers {
  display: flex; gap: 12px; justify-content: center; align-items: center;
  max-width: 940px; margin: 0 auto 14px; flex-wrap: nowrap; flex: 0 0 auto;
}
.picker-col { flex: 1 1 0; min-width: 0; max-width: 410px; display: flex; flex-direction: column; gap: 6px; }
.select-wrap { position: relative; }
.select-wrap::after {
  content: ""; position: absolute; right: 17px; top: 50%; width: 8px; height: 8px;
  border-right: 2px solid var(--text-dim); border-bottom: 2px solid var(--text-dim);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
select {
  width: 100%; appearance: none; -webkit-appearance: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  color: var(--text); font-family: "Google Sans"; font-size: 15px; font-weight: 500;
  padding: 16px 42px 16px 20px; cursor: pointer; outline: none;
  text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, var(--shadow);
}
select:focus { border-color: var(--accent); }

/* glass dial card */
.stage-wrap { display: grid; place-items: center; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.dial-card {
  position: relative; border-radius: 50%; padding: 6px; max-width: 100%; max-height: 100%;
  background: var(--surface); border: 1px solid var(--border);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, var(--shadow);
}
#dial { display: block; width: min(90vw, 58vh, 640px); height: auto; max-height: 100%; border-radius: 50%; }

.search-input {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--border-2);
  color: var(--text); font-family: "Google Sans"; font-size: 13px; font-weight: 500;
  padding: 8px 20px 6px; outline: none;
}
.search-input::placeholder { color: var(--text-faint); }

.version-tag {
  position: fixed; bottom: 10px; right: 14px; z-index: 5; pointer-events: none;
  font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--text-faint);
}

@media (max-width: 560px) {
  .pickers { flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .picker-col { flex: 1 1 100%; max-width: none; order: 1; gap: 4px; }
}

@media (max-height: 750px) {
  header { padding-top: 6px; }
  main { padding-top: 6px; padding-bottom: 8px; }
  .pickers { margin-bottom: 8px; }
  .picker-col { gap: 3px; }
  #dial { width: min(88vw, 46vh, 520px); }
}
</style>
</head>
<body>
<div class="dot-canvas-wrap" aria-hidden="true"><canvas id="dot-canvas"></canvas></div>
<div class="version-tag" id="versionTag" aria-hidden="true"></div>

<header>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
  </button>
</header>

<main>
  <div class="pickers">
    <div class="picker-col">
      <input class="search-input" id="searchLeft" type="text" placeholder="Search…" aria-label="Filter home zone" autocomplete="off">
      <div class="select-wrap"><select id="selLeft" aria-label="Home zone"></select></div>
    </div>
    <div class="picker-col">
      <input class="search-input" id="searchRight" type="text" placeholder="Search…" aria-label="Filter their zone" autocomplete="off">
      <div class="select-wrap"><select id="selRight" aria-label="Their zone"></select></div>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="dial-card">
      <canvas id="dial" aria-label="Time zone comparison dials"></canvas>
    </div>
  </div>
</main>

<script src="tz-data.js"></script>
<script src="astro.js"></script>
<script src="app.js"></script>
<script src="dotgrid.js"></script>
</body>
</html>
